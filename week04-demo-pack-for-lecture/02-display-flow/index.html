<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display and Flow Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Display controls participation in layout</h1>
  <section><h2>Block</h2><div class="box block">One</div><div class="box block">Two</div></section>
  <section><h2>Inline and inline-block</h2><a class="link inline" href="#">Inline link</a><a class="link inline-block" href="#">Inline-block link</a></section>
  <section><h2>Hidden but occupying space</h2><div class="box">Before</div><div class="box invisible">Hidden</div><div class="box">After</div></section>
</body>
</html>
