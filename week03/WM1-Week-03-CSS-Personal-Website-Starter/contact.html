<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact form for Alex Morgan">
  <title>Alex Morgan | Contact Me</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a aria-current="page" href="contact.html">Contact Me</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="card contact-card">
      <h2>Send a message</h2>
      <p>Use the form below to ask a question or suggest a project idea.</p>
      <form action="#" method="post">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="topic">Topic</label>
        <select id="topic" name="topic"><option value="">Choose a topic</option><option>Course question</option><option>Project idea</option><option>Other</option></select>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
        <button type="submit">Send message</button>
      </form>
    </section>
  </main>
  <footer><p>&copy; 2026 Alex Morgan</p></footer>
</body>
</html>
